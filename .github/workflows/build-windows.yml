            name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          set -e

          echo "Searching for Android project..."

          if find . -type f -name "gradlew" | grep -q .; then
            PROJECT_DIR=$(dirname "$(find . -type f -name "gradlew" | head -1)")
          else
            PROJECT_DIR=$(find . -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "gradlew not found."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Protocol-Police-Duty-APK
          path: "${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
