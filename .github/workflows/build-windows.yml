            name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract ZIP
        shell: powershell
        run: |
          $zip = Get-ChildItem -Recurse -Filter "Police-Duty-Rotation-Windows-Cloud-Build.zip" | Select-Object -First 1

          if (-not $zip) {
            throw "ZIP file not found"
          }

          Expand-Archive $zip.FullName -DestinationPath extracted -Force

      - name: Find and copy complete app
        shell: powershell
        run: |
          $html = Get-ChildItem extracted -Recurse -Filter "index.html" | Select-Object -First 1

          if (-not $html) {
            throw "index.html not found"
          }

          New-Item -ItemType Directory -Force winapp | Out-Null

          Copy-Item `
            (Join-Path $html.Directory.FullName '*') `
            winapp `
            -Recurse `
            -Force

      - name: Copy app logo
        shell: powershell
        run: |
          if (Test-Path "logo.png") {
            Copy-Item "logo.png" "winapp\logo.png" -Force
          }

      - name: Create Electron project
        shell: powershell
        run: |
          Set-Location winapp

          $package = @'
          {
            "name": "police-duty-rotation",
            "version": "1.0.0",
            "description": "Protocol Police Duty",
            "main": "main.js",
            "scripts": {
              "dist": "electron-builder --win"
            },
            "devDependencies": {
              "electron": "^38.8.6",
              "electron-builder": "^26.15.3"
            },
            "build": {
              "appId": "com.police.duty.rotation",
              "productName": "Protocol Police Duty",
              "files": [
                "**/*"
              ],
              "win": {
                "target": "nsis",
                "icon": "logo.png"
              }
            }
          }
          '@

          [System.IO.File]::WriteAllText(
            "package.json",
            $package,
            (New-Object System.Text.UTF8Encoding($false))
          )

          $main = @'
          const { app, BrowserWindow } = require('electron');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1400,
              height: 900,
              minWidth: 1000,
              minHeight: 700,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false
              }
            });

            win.loadFile('index.html');
          }

          app.whenReady().then(() => {
            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          '@

          [System.IO.File]::WriteAllText(
            "main.js",
            $main,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location winapp
          npm install

      - name: Build EXE
        shell: powershell
        run: |
          Set-Location winapp
          npm run dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Protocol-Police-Duty-Windows-EXE
          path: winapp/dist/*.exe
